name: Backup do banco Supabase

# Faz um backup completo (pg_dump) do banco Supabase e guarda como artefato.
# - Automático: todo domingo 03:00 UTC (00:00 em Brasília)
# - Manual: aba "Actions" → "Backup do banco Supabase" → "Run workflow"
#   (use este ANTES da virada e sempre que quiser um ponto de restauração)
#
# PRÉ-REQUISITO (ação única do usuário):
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#   Nome: SUPABASE_DB_PASSWORD
#   Valor: APENAS a senha do banco (a mesma da criação do projeto Supabase),
#          sem codificar nada — pode ter @, #, etc. à vontade.
#   (host/usuário/porta não são segredos e já estão fixos abaixo.)

on:
  schedule:
    - cron: '0 3 * * 0'        # domingo 03:00 UTC
  workflow_dispatch:            # permite disparar manualmente

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente PostgreSQL 17 (mesma versão do Supabase)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update && sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Gerar dump
        env:
          PGHOST: aws-0-sa-east-1.pooler.supabase.com
          PGPORT: '5432'
          PGUSER: postgres.saalwqfjhnvleltqfftr
          PGDATABASE: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$PGPASSWORD" ]; then echo "❌ Falta o secret SUPABASE_DB_PASSWORD"; exit 1; fi
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          pg_dump --no-owner --no-privileges -Fc -f "backup-lumen-$STAMP.dump"
          ls -lh backup-lumen-*.dump
          echo "STAMP=$STAMP" >> $GITHUB_ENV

      - name: Guardar backup como artefato (retido 90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: backup-lumen-${{ env.STAMP }}
          path: backup-lumen-*.dump
          retention-days: 90
